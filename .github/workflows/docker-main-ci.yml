name: Java 11 CI/CD with Docker (Versioned Tags)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'  # Bisa juga 'adopt', 'zulu', dll.
          java-version: '11'

      - name: Build project with Maven
        run: mvn clean package

      - name: Extract Version from pom.xml
        id: extract_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull the image from dev branch
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/api-cdt-core-trx-service:${{ env.VERSION }}

      - name: Tag the image with latest
        run: docker tag ${{ secrets.DOCKER_USERNAME }}/api-cdt-core-trx-service:${{ env.VERSION }} ${{ secrets.DOCKER_USERNAME }}/api-cdt-core-trx-service:latest

      - name: Push the latest tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/api-cdt-core-trx-service:latest

